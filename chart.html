<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Parliament Chart</title>
<style>
  body {
    margin: 0;
    background: #f2f2f2;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  svg {
    width: 90vw;
    height: 80vh;
  }

  .legend {
    position: absolute;
    bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    font-size: 14px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-color {
    width: 14px;
    height: 14px;
  }
</style>
</head>
<body>

<svg id="parliament"></svg>
<div class="legend" id="legend"></div>

<script>

const parties = [
  { name: "PP", seats: 137, color: "#1f77b4" },
  { name: "PSOE", seats: 121, color: "#e41a1c" },
  { name: "Vox", seats: 33, color: "#66bb22" },
  { name: "Sumar", seats: 31, color: "#e377c2" },
  { name: "ERC", seats: 7, color: "#f39c12" },
  { name: "Junts", seats: 7, color: "#1abc9c" },
  { name: "EH Bildu", seats: 6, color: "#16a085" },
  { name: "PNV", seats: 5, color: "#2ecc71" },
  { name: "BNG", seats: 1, color: "#aec7e8" },
  { name: "UPN", seats: 1, color: "#08306b" },
  { name: "CCa", seats: 1, color: "#f1c40f" }
];

const seatGap = 4;   // spacing between seats

const svg = document.getElementById("parliament");
const totalSeats = parties.reduce((s,p)=>s+p.seats,0);
const width = svg.clientWidth;
const height = svg.clientHeight;
const centerX = width/2;
const centerY = height*0.92;
const maxRadius = Math.min(width/2, height*0.9);
const innerRadius = maxRadius * 0.4;

// Determine rows
let rows = Math.ceil(Math.sqrt(totalSeats) / 1.15);
const outerRadius = maxRadius;

let radii = [];
let circumferenceWeights = [];
let weightTotal = 0;

for (let r = 0; r < rows; r++) {
  const rowSpacing = 20; // temporary, will scale seats
  let radius = outerRadius - r * rowSpacing;
  if (radius <= innerRadius) break;
  radii.push(radius);
  let weight = Math.PI * radius;
  circumferenceWeights.push(weight);
  weightTotal += weight;
}

// Allocate seats per row
let rowSeatCounts = circumferenceWeights.map(w =>
  Math.floor(totalSeats * (w / weightTotal))
);

let assigned = rowSeatCounts.reduce((a,b)=>a+b,0);
while (assigned < totalSeats) {
  for (let i=0;i<rowSeatCounts.length && assigned<totalSeats;i++){
    rowSeatCounts[i]++;
    assigned++;
  }
}
while (assigned > totalSeats) {
  for (let i=rowSeatCounts.length-1;i>=0 && assigned>totalSeats;i--){
    if(rowSeatCounts[i]>0){
      rowSeatCounts[i]--;
      assigned--;
    }
  }
}

// Generate seat colors
let seatColors = [];
parties.forEach(p=>{
  for(let i=0;i<p.seats;i++){
    seatColors.push(p.color);
  }
});

// Draw seats
let seatIndex = 0;
for (let r = 0; r < radii.length; r++) {
  const radius = radii[r];
  const seatsInRow = rowSeatCounts[r];

  // Calculate dynamic seat radius to make edges flush
  const angleStep = Math.PI / (seatsInRow - 1);
  const rowSeatRadius = Math.min(10, (radius * angleStep - seatGap)/2);

  for (let i = 0; i < seatsInRow; i++) {
    const angle = i * angleStep;
    const x = centerX - radius * Math.cos(angle);
    const y = centerY - radius * Math.sin(angle);

    const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx", x);
    circle.setAttribute("cy", y);
    circle.setAttribute("r", rowSeatRadius);
    circle.setAttribute("fill", seatColors[seatIndex]);
    svg.appendChild(circle);

    seatIndex++;
  }
}

// Draw legend
const legendDiv = document.getElementById("legend");
parties.forEach(p=>{
  const item = document.createElement("div");
  item.className = "legend-item";
  const colorBox = document.createElement("div");
  colorBox.className = "legend-color";
  colorBox.style.backgroundColor = p.color;
  item.appendChild(colorBox);
  item.appendChild(document.createTextNode(`${p.name} (${p.seats})`));
  legendDiv.appendChild(item);
});

</script>
</body>
</html>
